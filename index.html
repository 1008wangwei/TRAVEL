<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沖繩夏日海島之旅 🏝️</title>
<meta name="description" content="沖繩夏日海島之旅 4 日行程手冊">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sea-deep:#0B7285;
    --sea:#22B8CF;
    --sea-soft:#D3F8F3;
    --sand:#FFFDF3;
    --sand-deep:#FFF3C4;
    --coral:#FF7F6B;
    --coral-soft:#FFE1DB;
    --sun:#FFD43B;
    --sun-soft:#FFF6D6;
    --leaf:#51CF66;
    --leaf-soft:#E3F9E5;
    --ink:#123B44;
    --ink-soft:#4C7680;
    --white:#FFFFFF;
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
    --shadow:0 8px 24px rgba(11,114,133,0.12);
    --shadow-sm:0 4px 12px rgba(11,114,133,0.09);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg,#DFF7F4 0%, #EAFBEA 35%, #FFF9E0 100%);
    background-attachment:fixed;
    font-family:'Noto Sans TC','Zen Maru Gothic',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:calc(30px + env(safe-area-inset-bottom));
  }

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    background:transparent;
  }

  @media (min-width:520px){
    body{ padding:24px 0 48px; }
    .app{
      border-radius:32px;
      box-shadow:0 20px 60px rgba(31,92,120,0.18);
      overflow:hidden;
      min-height:auto;
      background:#EAF6FB;
    }
  }

  /* ---------- Header ---------- */
  .header{
    position:relative;
    padding:calc(22px + env(safe-area-inset-top)) 24px 22px;
    background:linear-gradient(160deg, var(--sea) 0%, var(--sea-deep) 100%);
    color:var(--white);
    overflow:hidden;
    border-radius:0 0 32px 32px;
  }
  .header-top{
    display:flex; align-items:center; justify-content:space-between;
    position:relative; z-index:2;
  }
  .header-badge{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.22);
    border:1px solid rgba(255,255,255,0.4);
    padding:6px 14px 6px 10px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:500;
    letter-spacing:0.3px;
  }
  .header-body{
    display:flex; align-items:flex-end; justify-content:space-between; gap:10px;
    position:relative; z-index:2;
  }
  .header-text{ flex:1 1 auto; min-width:0; }
  .header-title{
    font-family:'Zen Maru Gothic',sans-serif;
    font-weight:900;
    font-size:24px;
    line-height:1.35;
    margin:16px 0 8px;
    text-shadow:0 2px 10px rgba(0,0,0,0.08);
  }
  .header-sub{
    font-size:13.5px;
    font-weight:500;
    opacity:0.95;
    display:flex; flex-wrap:wrap; gap:8px 14px;
  }
  .header-sub span{ display:inline-flex; align-items:center; gap:5px; }

  /* ---------- Tabs ---------- */
  .tabbar-wrap{
    position:sticky; top:0; z-index:20;
    background:var(--sand);
    padding:12px 14px 10px;
    box-shadow:0 6px 14px -8px rgba(31,92,120,0.25);
  }
  .tabbar{
    display:flex; gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .tabbar::-webkit-scrollbar{ display:none; }
  .tab-btn{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
    padding:8px 14px;
    border-radius:999px;
    border:1.5px solid transparent;
    background:var(--white);
    color:var(--ink-soft);
    font-family:'Noto Sans TC',sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .2s ease;
    line-height:1.15;
  }
  .tab-btn small{ font-weight:500; font-size:10.5px; opacity:0.8; }
  .tab-btn.active{
    background:var(--sea-deep);
    color:var(--white);
    border-color:var(--sea-deep);
    box-shadow:var(--shadow-sm);
    transform:translateY(-1px);
  }
  .tab-btn.active small{ opacity:0.85; }

  /* ---------- Content ---------- */
  .panel{ display:none; padding:18px 16px 28px; animation:fadeIn .35s ease; }
  .panel.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---- Overview ---- */
  .ov-hero{
    background:var(--white);
    border-radius:var(--radius-lg);
    padding:20px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
    margin-bottom:16px;
  }
  .ov-hero .hero-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .ov-hero h2{
    margin:0 0 4px; font-family:'Zen Maru Gothic',sans-serif; font-size:19px; color:var(--sea-deep);
  }
  .ov-hero p{ margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.6;}
  .ov-stats{
    display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;
  }
  .ov-stat{
    flex:1 1 auto; min-width:120px;
    background:var(--sea-soft);
    border-radius:var(--radius-md);
    padding:10px 12px;
  }
  .ov-stat .label{ font-size:11px; color:var(--sea-deep); font-weight:700; opacity:0.75;}
  .ov-stat .value{ font-size:16px; font-weight:700; color:var(--ink); margin-top:2px;}

  .ov-section-title{
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:15px; font-weight:700; color:var(--sea-deep);
    margin:20px 4px 10px; display:flex; align-items:center; gap:6px;
  }

  .day-card{
    display:flex; align-items:center; gap:14px;
    background:var(--white);
    border-radius:var(--radius-md);
    padding:14px 16px;
    box-shadow:var(--shadow-sm);
    margin-bottom:10px;
    cursor:pointer;
    border:1.5px solid transparent;
    transition:transform .15s ease, border-color .15s ease;
  }
  .day-card:active{ transform:scale(0.98); }
  .day-num{
    flex:0 0 auto;
    width:52px; height:52px;
    border-radius:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--sun-soft);
    color:var(--sea-deep);
  }
  .day-num .d{ font-family:'Zen Maru Gothic',sans-serif; font-weight:900; font-size:19px; line-height:1;}
  .day-num .w{ font-size:9.5px; font-weight:700; margin-top:2px; letter-spacing:0.3px;}
  .day-info{ flex:1 1 auto; min-width:0; }
  .day-info .title{ font-weight:700; font-size:14.5px; color:var(--ink); margin-bottom:3px;}
  .day-info .desc{ font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; }
  .day-arrow{ flex:0 0 auto; color:var(--sea); font-size:18px; }

  .budget-bar{
    background:var(--white); border-radius:var(--radius-md);
    padding:14px 16px; box-shadow:var(--shadow-sm); margin-bottom:10px;
    display:flex; align-items:center; gap:12px; cursor:pointer;
  }
  .budget-bar:active{ transform:scale(0.98); }
  .budget-bar .ic{ font-size:26px; }
  .budget-bar .txt{ flex:1; }
  .budget-bar .txt .l{ font-size:12px; color:var(--ink-soft); font-weight:500;}
  .budget-bar .txt .v{ font-size:17px; font-weight:700; color:var(--sea-deep); font-family:'Zen Maru Gothic',sans-serif;}

  /* ---- Day timeline ---- */
  .day-header{
    background:linear-gradient(135deg, var(--sea-soft), var(--white));
    border-radius:var(--radius-lg);
    padding:18px 18px 16px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow-sm);
  }
  .day-header .header-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .day-header h2{
    margin:0; font-family:'Zen Maru Gothic',sans-serif; color:var(--sea-deep); font-size:20px;
    display:flex; align-items:baseline; gap:8px; position:relative; z-index:2;
  }
  .day-header h2 .num{ font-size:26px; font-weight:900; }
  .day-header .date-line{
    margin-top:6px; font-size:12.5px; color:var(--ink-soft); font-weight:500; position:relative; z-index:2;
  }

  .timeline{ position:relative; padding-left:6px; }
  .timeline::before{
    content:''; position:absolute; left:29px; top:6px; bottom:6px; width:2px;
    background:repeating-linear-gradient(180deg, var(--sea) 0 6px, transparent 6px 12px);
    opacity:0.55;
  }
  .t-item{ position:relative; padding-left:58px; margin-bottom:16px; }
  .t-item:last-child{ margin-bottom:0; }
  .t-dot{
    position:absolute; left:15px; top:2px;
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    background:var(--white);
    box-shadow:0 0 0 4px #F8FBEF;
    border:2px solid var(--sea);
    z-index:2;
  }
  .t-time{
    display:inline-block;
    font-size:12px; font-weight:700; color:var(--white);
    background:var(--ink); padding:3px 10px; border-radius:999px;
    margin-bottom:6px;
    font-variant-numeric:tabular-nums;
  }
  .t-card{
    background:var(--white);
    border-radius:var(--radius-md);
    padding:14px 16px;
    box-shadow:var(--shadow-sm);
    border-left:5px solid var(--sea);
  }
  .t-card .t-title-row{
    display:flex; align-items:flex-start; justify-content:space-between; gap:8px;
  }
  .t-card .t-title{
    font-weight:700; font-size:15px; color:var(--ink); line-height:1.4;
    word-break:break-word;
  }
  .t-card .maplink{
    flex:0 0 auto;
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:10px;
    background:var(--sea-soft); color:var(--sea-deep);
    text-decoration:none; font-size:14px;
  }
  .t-tag{
    display:inline-block; margin-top:6px;
    font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:999px;
  }
  .t-note{
    margin-top:8px; font-size:13px; line-height:1.75; color:var(--ink-soft);
    white-space:pre-line; word-break:break-word;
  }

  /* type accent colors */
  .type-Transport .t-dot{ border-color:var(--sea); }
  .type-Transport .t-card{ border-left-color:var(--sea); }
  .type-Transport .t-tag{ background:var(--sea-soft); color:var(--sea-deep); }

  .type-Sightseeing .t-dot{ border-color:var(--leaf); }
  .type-Sightseeing .t-card{ border-left-color:var(--leaf); }
  .type-Sightseeing .t-tag{ background:var(--leaf-soft); color:#2C7A63; }

  .type-Restaurant .t-dot{ border-color:var(--sun); }
  .type-Restaurant .t-card{ border-left-color:var(--sun); }
  .type-Restaurant .t-tag{ background:var(--sun-soft); color:#96690C; }

  .type-Hotel .t-dot{ border-color:var(--sea-deep); }
  .type-Hotel .t-card{ border-left-color:var(--sea-deep); }
  .type-Hotel .t-tag{ background:#E4EEF2; color:var(--sea-deep); }

  .type-Shopping .t-dot{ border-color:var(--coral); }
  .type-Shopping .t-card{ border-left-color:var(--coral); }
  .type-Shopping .t-tag{ background:var(--coral-soft); color:#C24A3D; }

  .day-nav{
    display:flex; justify-content:space-between; gap:10px; margin-top:22px;
  }
  .day-nav button{
    flex:1; border:none; padding:12px; border-radius:var(--radius-md);
    font-family:'Noto Sans TC',sans-serif; font-weight:700; font-size:13.5px;
    background:var(--white); color:var(--sea-deep); box-shadow:var(--shadow-sm);
    cursor:pointer;
  }
  .day-nav button:disabled{ opacity:0.35; }

  /* ---- Checklist ---- */
  .cl-progress{
    background:var(--white); border-radius:var(--radius-lg); padding:16px 18px;
    box-shadow:var(--shadow); margin-bottom:16px; position:relative; overflow:hidden;
  }
  .cl-progress .cl-header-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .cl-progress h2{ margin:0 0 4px; font-family:'Zen Maru Gothic',sans-serif; color:var(--sea-deep); font-size:18px;}
  .cl-progress p{ margin:0 0 10px; font-size:12.5px; color:var(--ink-soft);}
  .cl-bar-track{ height:10px; border-radius:999px; background:var(--sea-soft); overflow:hidden; }
  .cl-bar-fill{ height:100%; background:linear-gradient(90deg,var(--leaf),var(--sea)); border-radius:999px; width:0%; transition:width .3s ease; }
  .cl-bar-label{ margin-top:6px; font-size:11.5px; color:var(--ink-soft); font-weight:600; }

  .cl-group-title{
    font-family:'Zen Maru Gothic',sans-serif; font-size:14.5px; font-weight:700;
    color:var(--sea-deep); margin:18px 4px 8px; display:flex; align-items:center; gap:6px;
  }
  .cl-item{
    display:flex; align-items:center; gap:12px;
    background:var(--white); border-radius:var(--radius-sm);
    padding:12px 14px; margin-bottom:8px; box-shadow:var(--shadow-sm);
    cursor:pointer; -webkit-user-select:none; user-select:none;
  }
  .cl-checkbox{
    flex:0 0 auto; width:22px; height:22px; border-radius:7px;
    border:2px solid var(--sea); display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--white); transition:all .15s ease;
  }
  .cl-item.done .cl-checkbox{ background:var(--sea); }
  .cl-item span.txt{ font-size:14px; color:var(--ink); transition:color .15s ease; }
  .cl-item.done span.txt{ color:var(--ink-soft); text-decoration:line-through; }

  /* ---- Expense tracker ---- */
  .ex-summary{
    background:linear-gradient(135deg, var(--sea) 0%, var(--sea-deep) 100%);
    border-radius:var(--radius-lg); padding:18px 20px; margin-bottom:16px;
    box-shadow:var(--shadow); color:var(--white); position:relative; overflow:hidden;
  }
  .ex-summary .l{ font-size:12.5px; opacity:0.9; font-weight:500; }
  .ex-summary .v{ font-family:'Zen Maru Gothic',sans-serif; font-weight:900; font-size:30px; margin-top:4px; }
  .ex-summary .v small{ font-size:15px; font-weight:700; opacity:0.85; margin-left:4px;}
  .ex-cat-row{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .ex-cat-chip{
    background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.35);
    border-radius:999px; padding:5px 12px; font-size:11.5px; font-weight:600;
  }

  .ex-form{
    background:var(--white); border-radius:var(--radius-lg); padding:16px;
    box-shadow:var(--shadow-sm); margin-bottom:16px;
  }
  .ex-form h3{ margin:0 0 12px; font-family:'Zen Maru Gothic',sans-serif; font-size:15px; color:var(--sea-deep); }
  .ex-form-row{ display:flex; gap:8px; margin-bottom:10px; }
  .ex-form-row:last-child{ margin-bottom:0; }
  .ex-form input, .ex-form select{
    flex:1; min-width:0;
    border:1.5px solid var(--sea-soft); background:var(--sand);
    border-radius:var(--radius-sm); padding:10px 12px; font-size:14px;
    font-family:'Noto Sans TC',sans-serif; color:var(--ink);
    -webkit-appearance:none; appearance:none;
  }
  .ex-form input:focus, .ex-form select:focus{ outline:none; border-color:var(--sea); }
  .ex-form input[type="number"]{ flex:0 0 110px; }
  .ex-form select{ flex:0 0 92px; }
  .ex-add-btn{
    width:100%; border:none; padding:12px; border-radius:var(--radius-sm);
    background:var(--coral); color:var(--white); font-weight:700; font-size:14.5px;
    font-family:'Noto Sans TC',sans-serif; cursor:pointer;
  }
  .ex-add-btn:active{ transform:scale(0.98); }

  .ex-empty{
    text-align:center; padding:26px 16px; color:var(--ink-soft); font-size:13px;
    background:var(--white); border-radius:var(--radius-md); box-shadow:var(--shadow-sm);
  }
  .ex-item{
    display:flex; align-items:center; gap:12px;
    background:var(--white); border-radius:var(--radius-sm);
    padding:12px 14px; margin-bottom:8px; box-shadow:var(--shadow-sm);
  }
  .ex-item .ex-icon{
    flex:0 0 auto; width:38px; height:38px; border-radius:11px;
    display:flex; align-items:center; justify-content:center; font-size:17px;
    background:var(--sea-soft);
  }
  .ex-item .ex-mid{ flex:1; min-width:0; }
  .ex-item .ex-name{ font-size:14px; font-weight:700; color:var(--ink); word-break:break-word; }
  .ex-item .ex-meta{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .ex-item .ex-amount{ flex:0 0 auto; font-weight:700; color:var(--sea-deep); font-size:14.5px; font-family:'Zen Maru Gothic',sans-serif; white-space:nowrap; }
  .ex-item .ex-del{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%;
    border:none; background:var(--coral-soft); color:#C24A3D; font-size:14px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }

  /* ---- Footer ---- */
  .footer{
    text-align:center; padding:20px 20px 6px; font-size:11.5px; color:var(--ink-soft);
    line-height:1.7;
  }
  .footer .sig{ font-family:'Zen Maru Gothic',sans-serif; color:var(--sea-deep); font-weight:700; }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <span class="header-badge">✈️ TAICHUNG → OKINAWA</span>
      <span class="header-badge" id="hdrCountdown">4 天 3 夜</span>
    </div>
    <div class="header-body">
      <div class="header-text">
        <div class="header-title" id="tripTitle">沖繩夏日海島之旅 🏝️</div>
        <div class="header-sub" id="tripSub"></div>
      </div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabbar-wrap">
    <div class="tabbar" id="tabbar"></div>
  </div>

  <!-- PANELS -->
  <div id="panels"></div>

  <div class="footer">
    <div class="sig">🌺 一路平安・玩得開心 🌺</div>
    <div>資料如有異動請以現場公告為準</div>
  </div>
</div>

<script>

function fmtDate(iso){

/* ---------------- build tabs ---------------- */
function buildTabs(){
  const bar = document.getElementById('tabbar');
  let html = `<button class="tab-btn" data-tab="overview">🏠 總覽</button>`;
  DATA.days.forEach(d=>{
    html += `<button class="tab-btn" data-tab="day-${d.day}">Day ${d.day}<small>${fmtDate(d.date)}</small></button>`;
  });
  html += `<button class="tab-btn" data-tab="expenses">💰 記帳本</button>`;
  html += `<button class="tab-btn" data-tab="checklist">🧳 打包清單</button>`;
  bar.innerHTML = html;
  bar.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
  });
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('active', p.id === 'panel-'+tab));
  const wrap = document.querySelector('.tabbar-wrap');
  const active = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
  if(active) active.scrollIntoView({inline:'center', behavior:'smooth', block:'nearest'});
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}

/* ---------------- day panel ---------------- */
function buildDayPanel(day){
  const idx = DATA.days.findIndex(d=>d.day===day.day);
  const prev = DATA.days[idx-1];
  const next = DATA.days[idx+1];

  let items = day.activities.map(a=>{
    const type = a.type || 'Sightseeing';
    const icon = TYPE_ICON[type] || '📍';
    const label = TYPE_LABEL[type] || '行程';
    const mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a.location + ' 沖繩');
    return `
      <div class="t-item type-${type}">
        <div class="t-dot">${icon}</div>
        <div class="t-time">${fmtTime(a.time)}</div>
        <div class="t-card">
          <div class="t-title-row">
            <div class="t-title">${escapeHtml(a.location||'')}</div>
            <a class="maplink" href="${mapUrl}" target="_blank" rel="noopener" aria-label="在地圖上查看">📍</a>
          </div>
          <span class="t-tag">${label}</span>
          ${a.note ? `<div class="t-note">${escapeHtml(a.note)}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  return `
    <div class="day-header">
      <div class="header-row">
        <div>
          <h2><span class="num">Day ${day.day}</span><span>${day.weekday}</span></h2>

      </div>

    <div class="timeline">${items}</div>
    <div class="day-nav">
      <button ${prev? '' : 'disabled'} data-goto="${prev? 'day-'+prev.day : ''}">‹ 前一天</button>
      <button ${next? '' : 'disabled'} data-goto="${next? 'day-'+next.day : 'checklist'}">${next? '後一天 ›' : '打包清單 🧳'}</button>
    </div>
  `;
}

/* ---------------- checklist panel ---------------- */
const STORAGE_KEY = 'okinawa-trip-checklist-v1';
function loadChecked(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ return {}; }
}
function saveChecked(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function buildChecklistPanel(){
  const groups = {};
  const order = [];
  DATA.checklist.forEach(c=>{
    if(!groups[c.category]){ groups[c.category]=[]; order.push(c.category); }
    groups[c.category].push(c.item);
  });

  let groupHtml = order.map(cat=>{
    const items = groups[cat].map((item,i)=>{
      const key = cat+'::'+item;
      return `<div class="cl-item" data-key="${escapeHtml(key)}">
        <div class="cl-checkbox">✓</div>
        <span class="txt">${escapeHtml(item)}</span>
      </div>`;
    }).join('');
    const icon = cat.includes('隨身') ? '🎒' : '🧳';
    return `<div class="cl-group-title">${icon} ${escapeHtml(cat)}</div>${items}`;
  }).join('');

  return `
    <div class="cl-progress">
      <div class="cl-header-row">
        <div>
          <h2>行前打包清單</h2>
          <p>點選項目即可打勾，紀錄會保留在這台裝置上。</p>
        </div>
      </div>
      <div class="cl-bar-track"><div class="cl-bar-fill" id="clBarFill"></div></div>
      <div class="cl-bar-label" id="clBarLabel">0 / 0 已完成</div>
    </div>
    ${groupHtml}
  `;
}

function refreshChecklistProgress(){
  const state = loadChecked();
  const total = DATA.checklist.length;
  const done = DATA.checklist.filter(c=> state[c.category+'::'+c.item]).length;
  const fill = document.getElementById('clBarFill');
  const label = document.getElementById('clBarLabel');
  if(fill) fill.style.width = (total? (done/total*100):0) + '%';
  if(label) label.textContent = `${done} / ${total} 已完成`;
}

function bindChecklistEvents(panel){
  const state = loadChecked();
  panel.querySelectorAll('.cl-item').forEach(el=>{
    const key = el.dataset.key;
    if(state[key]) el.classList.add('done');
    el.addEventListener('click', ()=>{
      const s = loadChecked();
      s[key] = !s[key];
      saveChecked(s);
      el.classList.toggle('done', !!s[key]);
      refreshChecklistProgress();
    });
  });
  refreshChecklistProgress();
}

/* ---------------- expense tracker (記帳本) ----------------
   本機記帳功能：資料儲存在使用者裝置的瀏覽器 localStorage，
   僅供個人於旅途中隨手記錄花費與快速加總，非多人即時同步帳本。 */
const EXPENSE_KEY = 'okinawa-trip-expenses-v1';
const EXPENSE_CATEGORIES = {
  Transport:{icon:'🚗', label:'交通'},
  Food:{icon:'🍜', label:'餐飲'},
  Shopping:{icon:'🛍️', label:'購物'},
  Hotel:{icon:'🌙', label:'住宿'},
  Other:{icon:'💴', label:'其他'}
};

function loadExpenses(){
  try{ return JSON.parse(localStorage.getItem(EXPENSE_KEY)) || []; }catch(e){ return []; }
}
function saveExpenses(list){
  try{ localStorage.setItem(EXPENSE_KEY, JSON.stringify(list)); }catch(e){}
}

function buildExpensesPanel(){
  const dayOptions = DATA.days.map(d=>`<option value="${d.day}">Day ${d.day}（${fmtDate(d.date)}）</option>`).join('');
  return `
    <div class="ex-summary">
      <div class="l">目前總花費</div>
      <div class="v" id="exTotal">¥ 0<small>JPY</small></div>
      <div class="ex-cat-row" id="exCatRow"></div>
    </div>

    <div class="ex-form">
      <h3>✏️ 新增一筆花費</h3>
      <div class="ex-form-row">
        <input type="text" id="exItemInput" placeholder="項目名稱，例如：拉麵午餐" maxlength="40">
      </div>
      <div class="ex-form-row">
        <input type="number" id="exAmountInput" placeholder="金額 ¥" min="0" inputmode="numeric">
        <select id="exCategoryInput">
          ${Object.entries(EXPENSE_CATEGORIES).map(([k,v])=>`<option value="${k}">${v.icon} ${v.label}</option>`).join('')}
        </select>
        <select id="exDayInput">
          <option value="">未指定日期</option>
          ${dayOptions}
        </select>
      </div>
      <div class="ex-form-row">
        <button class="ex-add-btn" id="exAddBtn">➕ 加入記帳本</button>
      </div>
    </div>

    <div class="ov-section-title">🧾 花費紀錄</div>
    <div id="exListWrap"></div>
  `;
}

function fmtMoney(n){
  return '¥ ' + Number(n||0).toLocaleString();
}

function renderExpenseList(){
  const list = loadExpenses();
  const wrap = document.getElementById('exListWrap');
  if(!wrap) return;

  if(list.length === 0){
    wrap.innerHTML = `<div class="ex-empty">還沒有任何記帳紀錄 🌊<br>在上方新增第一筆花費吧！</div>`;
  } else {
    const sorted = [...list].sort((a,b)=> b.ts - a.ts);
    wrap.innerHTML = sorted.map(e=>{
      const cat = EXPENSE_CATEGORIES[e.category] || EXPENSE_CATEGORIES.Other;
      const dayLabel = e.day ? `Day ${e.day}` : '未指定日期';
      return `
        <div class="ex-item" data-id="${e.id}">
          <div class="ex-icon">${cat.icon}</div>
          <div class="ex-mid">
            <div class="ex-name">${escapeHtml(e.item || cat.label)}</div>
            <div class="ex-meta">${cat.label}・${dayLabel}</div>
          </div>
          <div class="ex-amount">${fmtMoney(e.amount)}</div>
          <button class="ex-del" data-del="${e.id}" aria-label="刪除">✕</button>
        </div>`;
    }).join('');
  }

  // total
  const total = list.reduce((s,e)=> s + (Number(e.amount)||0), 0);
  const totalEl = document.getElementById('exTotal');
  if(totalEl) totalEl.innerHTML = `${fmtMoney(total)}<small>JPY</small>`;
  const ovTotalEl = document.getElementById('ovExpenseTotal');
  if(ovTotalEl) ovTotalEl.textContent = fmtMoney(total);

  // category breakdown chips (only categories with spending)
  const byCat = {};
  list.forEach(e=>{ byCat[e.category] = (byCat[e.category]||0) + (Number(e.amount)||0); });
  const catRow = document.getElementById('exCatRow');
  if(catRow){
    const chips = Object.entries(byCat)
      .filter(([,v])=> v>0)
      .sort((a,b)=> b[1]-a[1])
      .map(([k,v])=>{
        const cat = EXPENSE_CATEGORIES[k] || EXPENSE_CATEGORIES.Other;
        return `<span class="ex-cat-chip">${cat.icon} ${cat.label} ${fmtMoney(v)}</span>`;
      }).join('');
    catRow.innerHTML = chips;
  }
}

function bindExpenseEvents(panel){
  renderExpenseList();

  const addBtn = document.getElementById('exAddBtn');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      const itemInput = document.getElementById('exItemInput');
      const amountInput = document.getElementById('exAmountInput');
      const categoryInput = document.getElementById('exCategoryInput');
      const dayInput = document.getElementById('exDayInput');

      const amount = parseFloat(amountInput.value);
      if(!amount || amount <= 0){
        amountInput.focus();
        return;
      }
      const list = loadExpenses();
      list.push({
        id: 'e' + Date.now() + Math.random().toString(36).slice(2,7),
        item: itemInput.value.trim(),
        amount: amount,
        category: categoryInput.value,
        day: dayInput.value ? Number(dayInput.value) : null,
        ts: Date.now()
      });
      saveExpenses(list);
      itemInput.value = '';
      amountInput.value = '';
      renderExpenseList();
      itemInput.focus();
    });
  }

  panel.addEventListener('click', (e)=>{
    const delBtn = e.target.closest('[data-del]');
    if(delBtn){
      const id = delBtn.dataset.del;
      const list = loadExpenses().filter(e=> e.id !== id);
      saveExpenses(list);
      renderExpenseList();
    }
  });
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

/* ---------------- render all ---------------- */
function render(){
  buildHeader();
  buildTabs();

  const panels = document.getElementById('panels');
  let html = `<div class="panel active" id="panel-overview">${buildOverviewPanel()}</div>`;
  DATA.days.forEach(d=>{
    html += `<div class="panel" id="panel-day-${d.day}">${buildDayPanel(d)}</div>`;
  });
  html += `<div class="panel" id="panel-expenses">${buildExpensesPanel()}</div>`;
  html += `<div class="panel" id="panel-checklist">${buildChecklistPanel()}</div>`;
  panels.innerHTML = html;

  // event delegation for goto buttons/cards
  panels.addEventListener('click', (e)=>{
    const target = e.target.closest('[data-goto]');
    if(target && target.dataset.goto){
      switchTab(target.dataset.goto);
    }
  });

  bindChecklistEvents(document.getElementById('panel-checklist'));
  bindExpenseEvents(document.getElementById('panel-expenses'));
  renderExpenseList();
  switchTab('overview');
}

render();
</script>
</body>
